[project]
name = "quero-backend"
version = "0.1.0"
description = "QUERO - Quadro Universitário de Estágios Remunerados e Oportunidades (API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    "python-multipart==0.0.19",
    "reportlab==4.2.5",
    "tzdata==2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
