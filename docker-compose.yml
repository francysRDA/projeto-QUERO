services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quero
      POSTGRES_PASSWORD: quero
      POSTGRES_DB: quero
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quero"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"   # interface web
      - "1025:1025"   # SMTP

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://quero:quero@db:5432/quero
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      STORAGE_DIR: /data/arquivos
      ENV: dev
    volumes:
      - ./backend:/app
      - arquivos:/data/arquivos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://quero:quero@db:5432/quero
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      STORAGE_DIR: /data/arquivos
      ENV: dev
    volumes:
      - ./backend:/app
      - arquivos:/data/arquivos
    depends_on:
      backend:
        condition: service_started
    command: python -m app.worker

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata:
  arquivos:
  frontend_node_modules:
